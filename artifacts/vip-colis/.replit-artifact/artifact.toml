kind = "web"
previewPath = "/"
title = "VIP Colis"
version = "1.0.0"
id = "artifacts/vip-colis"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22534

[services.development]
run = "pnpm --filter @workspace/vip-colis run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/vip-colis", "run", "build" ]
publicDir = "artifacts/vip-colis/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22534"
BASE_PATH = "/"
