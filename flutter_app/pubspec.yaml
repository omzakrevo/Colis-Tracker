name: vip_colis
description: "Tchi — gestion de colis et de transport."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  connectivity_plus: ^7.3.2
  cryptography: ^2.9.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.0.2
  google_fonts: ^6.3.3
  image_picker: ^1.2.4
  intl: ^0.20.3
  mobile_scanner: ^7.4.2
  package_info_plus: ^10.2.2
  pdf: ^3.13.1
  printing: ^5.15.1
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.3
  signature: ^6.4.0
  supabase_flutter: ^2.18.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/tchi_logo_512.png

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/branding/tchi_icon_1024.png"
  adaptive_icon_background: "#F28C28"
  adaptive_icon_foreground: "assets/branding/tchi_foreground_1024.png"
  web:
    generate: true
    image_path: "assets/branding/tchi_icon_1024.png"
    background_color: "#F6F7F6"
    theme_color: "#0E2621"
