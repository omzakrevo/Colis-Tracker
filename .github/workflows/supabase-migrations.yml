name: Migrations Supabase

# Applique automatiquement les fichiers de supabase/migrations/ sur votre VPS.
# Sur une pull request : simple vérification (dry-run). Sur main : application réelle.
on:
  pull_request:
    paths: ["supabase/migrations/**"]
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:

concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      # Secret GitHub à créer : Settings > Secrets and variables > Actions
      # Format : postgresql://postgres:MOT_DE_PASSE@vps-ef39f3a3.vps.ovh.ca:5432/postgres
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Vérification (dry-run)
        if: github.event_name == 'pull_request'
        run: supabase db push --db-url "$SUPABASE_DB_URL" --dry-run
      - name: Application des migrations
        if: github.event_name != 'pull_request'
        run: supabase db push --db-url "$SUPABASE_DB_URL"
