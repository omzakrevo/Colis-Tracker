name: Migrations Supabase

# Applique automatiquement les fichiers de supabase/migrations/ sur votre VPS.
# Le job tourne sur un runner GitHub auto-hébergé installé sur le VPS : la base n'a donc
# pas besoin d'être exposée sur internet.
# (Pas de déclencheur pull_request : un runner auto-hébergé ne doit pas exécuter le code de PR externes.)
on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:

concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: [self-hosted, linux]
    env:
      # Secret GitHub : Settings > Secrets and variables > Actions > Repository secrets
      # Connexion locale via Supavisor :
      # postgresql://postgres.TENANT_ID:MOT_DE_PASSE@localhost:5432/postgres
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Vérification (dry-run)
        run: supabase db push --db-url "$SUPABASE_DB_URL" --dry-run
      - name: Application des migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL"
